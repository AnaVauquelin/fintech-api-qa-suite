name: FinTech API QA, Docker & IaC Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-and-security:
    name: "1. Lint & Security Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff bandit
      - run: ruff check app/ tests/
      - run: bandit -r app/ -ll

  terraform-iac-check:
    name: "2. Terraform IaC Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format & Validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

  docker-compose-e2e:
    name: "3. Docker Compose Containerized QA Suite"
    needs: [static-and-security, terraform-iac-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run API + Redis + Pytest in Docker Compose
        run: |
          docker compose up --build --abort-on-container-exit --exit-code-from qa-runner
      - name: Tear down containers
        if: always()
        run: docker compose down -v
